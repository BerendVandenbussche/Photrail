<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f" />
      <stop offset="0.55" stop-color="#12173d" />
      <stop offset="1" stop-color="#38216b" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f45e6" />
      <stop offset="1" stop-color="#8c4dd9" />
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#a3a6ff" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#bg)" />

  <!-- soft glow -->
  <circle cx="1010" cy="70" r="220" fill="#4f45e6" opacity="0.16" />
  <circle cx="150" cy="300" r="180" fill="#8c4dd9" opacity="0.12" />

  <!-- logo mark -->
  <g transform="translate(120 92)">
    <rect x="0" y="0" width="156" height="156" rx="40" fill="url(#tile)" />
    <g transform="translate(34 34) scale(0.874)">
      <path d="M22 80 C 30 30, 70 72, 78 24" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
      <circle cx="22" cy="80" r="5" fill="#ffffff" />
      <circle cx="78" cy="24" r="9.5" fill="#ffffff" />
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="320" y="172" font-size="104" font-weight="700" fill="url(#word)" letter-spacing="-2">Photrail</text>
  <text x="324" y="230" font-size="34" font-weight="500" fill="#a3a6ff">Your travel history, automatically.</text>
  <text x="324" y="278" font-size="22" font-weight="400" fill="#8b8fb5">Turns your photo library into a travel map — 100% on-device.</text>
</svg>
