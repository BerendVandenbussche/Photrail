name: 🐛 Bug Report
description: Create a report to help us fix an issue with Photrail.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I generate a trip, the app crashes...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Device & iOS Version
      description: What device and OS are you using?
      placeholder: e.g., iPhone 15 Pro, iOS 17.4
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Photrail Version
      description: Which TestFlight version are you testing?
      placeholder: e.g., v1.2 (Build 4)
    validations:
      required: true
